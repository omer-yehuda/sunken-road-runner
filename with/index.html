<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Sunken Road</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": {
  "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/" } }</script>
</head>
<body>
<div class="hud">
  <div class="chip" id="relicBox" aria-label="Relics"><i class="gem"></i><b id="relics">0</b></div>
  <div class="chip right" aria-label="Distance"><b id="dist">0</b><span>m</span></div>
</div>
<div id="zone" role="status"></div>
<div id="start" class="on" role="dialog" aria-label="Start">
  <div class="card">
    <h1>The Sunken Road</h1>
    <p class="keys"><b>&larr; &rarr;</b> change lane &nbsp; <b>&uarr;</b> jump &nbsp; <b>&darr;</b> slide</p>
    <p class="keys">On a phone: swipe</p>
    <div class="bar"><i id="load"></i></div>
    <p class="go" id="go">Loading the art</p>
  </div>
</div>
<div id="over" role="dialog" aria-label="Run over">
  <div class="card">
    <h1>The road wins</h1>
    <div class="row"><span>Distance</span><b id="finalDist">0 m</b></div>
    <div class="row"><span>Relics</span><b id="finalRelics">0</b></div>
    <div class="row" id="bestRow"><span>Best</span><b id="bestDist">0 m</b></div>
    <button id="again">Run again</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
